name: Desktop packages
on:
  push:
    branches: [main, desktop-packages]
    tags: ['v*']
    paths-ignore: ['**.md', 'NOTICE', '.github/workflows/bootstrap.yml']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  translations:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt translation compiler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qttools5-dev-tools qttranslations5-l10n
      - name: Validate and compile all 12 languages
        run: |
          python3 scripts/build_translations.py --strict
          python3 -m compileall -q src/main/python scripts tests
          cat build/translation-coverage.md >> "$GITHUB_STEP_SUMMARY"
          for file in /usr/share/qt5/translations/qtbase_*.qm; do
            cp "$file" src/main/resources/base/translations/
          done
      - name: Require complete extracted translations for stable tags
        if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-')
        run: python3 scripts/build_translations.py --strict
      - uses: actions/upload-artifact@v4
        with:
          name: translations
          path: |
            src/main/resources/base/translations
            build/translation-coverage.*
            build/translation-inventory.json
          if-no-files-found: error

  windows:
    needs: translations
    runs-on: windows-2022
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: translations
          path: .
      - uses: actions/setup-python@v5
        with:
          python-version: '3.6.8'
          architecture: x64
      - name: Install upstream-compatible dependencies
        run: |
          python -m pip install "pip==21.3.1" "setuptools==57.5.0" "wheel==0.37.1" "Cython==0.29.36"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install -r requirements.txt "pytest==6.2.5" "pytest-qt==3.3.0"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run upstream regressions and language tests
        timeout-minutes: 8
        run: |
          python scripts/run_tests.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install upstream legacy Visual C++ runtime
        run: |
          Invoke-WebRequest -Uri "https://download.microsoft.com/download/3/2/2/3224B87F-CFA0-4E70-BDA3-3DE650EFEBA5/vcredist_x64.exe" -OutFile "$env:RUNNER_TEMP/vcredist_x64.exe"
          $installer = Start-Process -FilePath "$env:RUNNER_TEMP/vcredist_x64.exe" -ArgumentList "/install", "/quiet", "/norestart" -WindowStyle Hidden -Wait -PassThru
          if ($installer.ExitCode -notin @(0, 1638, 3010, 5100)) { throw "Visual C++ runtime installation failed: $($installer.ExitCode)" }
          Invoke-WebRequest -Uri "https://download.microsoft.com/download/1/6/B/16B06F60-3B20-4FF2-B699-5E9B7962F9AE/VSU4/vcredist_x64.exe" -OutFile "$env:RUNNER_TEMP/vcredist2012_x64.exe"
          $signature = Get-AuthenticodeSignature "$env:RUNNER_TEMP/vcredist2012_x64.exe"
          if ($signature.Status -ne "Valid" -or $signature.SignerCertificate.Subject -notmatch "Microsoft") { throw "Invalid Microsoft runtime signature" }
          $installer = Start-Process -FilePath "$env:RUNNER_TEMP/vcredist2012_x64.exe" -ArgumentList "/install", "/quiet", "/norestart" -WindowStyle Hidden -Wait -PassThru
          if ($installer.ExitCode -notin @(0, 1638, 3010)) { throw "Visual C++ 2012 installation failed: $($installer.ExitCode)" }
          $ucrt = Get-ChildItem -Path "${env:ProgramFiles(x86)}/Windows Kits/10/Redist" -Filter "api-ms-win-crt-multibyte-l1-1-0.dll" -Recurse | Where-Object { $_.Directory.Name -eq "x64" } | Select-Object -First 1
          if ($ucrt) { $ucrt.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append }
      - name: Freeze portable application
        run: |
          fbs freeze
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Smoke test the frozen EXE in all languages
        env:
          QT_QPA_PLATFORM: windows
        run: |
          $ErrorActionPreference = "Stop"
          foreach ($language in @("en", "zh_CN", "zh_TW", "ja", "de", "fr", "es", "pt_BR", "ko", "it", "ru", "pl")) {
            $smokeOutput = Join-Path (Get-Location) "build/smoke/$language"
            New-Item -ItemType Directory -Force $smokeOutput | Out-Null
            $process = Start-Process -FilePath "./target/Vial/Vial.exe" -ArgumentList "--pandakb-smoke-test",$language,$smokeOutput -WindowStyle Hidden -PassThru
            if (-not $process.WaitForExit(60000)) {
              Stop-Process -Id $process.Id
              throw "Frozen application timed out: $language"
            }
            if ($process.ExitCode -ne 0) { throw "Frozen application failed: $language ($($process.ExitCode))" }
            $resultFile = Join-Path $smokeOutput "smoke-$language.json"
            if (-not (Test-Path $resultFile)) { throw "Missing smoke result: $language" }
            $result = Get-Content $resultFile -Raw | ConvertFrom-Json
            if ($result.language -ne $language -or $result.errors.Count -ne 0) { throw "Invalid smoke result: $language" }
          }
      - name: Read native smoke diagnostics
        if: always()
        run: |
          Get-ChildItem build/smoke -Include "*.log","smoke-*.json" -Recurse -ErrorAction SilentlyContinue | ForEach-Object { Write-Output $_.Name; Get-Content $_.FullName }
      - name: Validate and package ZIP with license and checksum
        run: |
          python scripts/package_portable.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip freeze | Out-File -Encoding utf8 build/dependency-versions.txt
      - name: Build and test per-user Windows installer
        run: ./scripts/windows_installer.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: PandaKB-Vial-Windows-x64
          path: dist/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-report
          path: build/
          if-no-files-found: warn

  unix:
    needs: translations
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            package: Linux-x86_64
          - runner: macos-15
            package: macOS-arm64
          - runner: macos-15-intel
            package: macOS-x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: translations
          path: .
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Linux GUI and HID libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends desktop-file-utils fonts-noto-cjk libgl1 libudev-dev libusb-1.0-0-dev libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 xauth xvfb
      - name: Set up Python and validate native HID backend
        id: native-hid
        env:
          HIDAPI_WITH_HIDRAW: '1'
          HIDAPI_WITH_LIBUSB: '1'
        run: |
          python -m pip install --no-deps fbs==0.9.0
          # Install the same Vial-pinned simpleeval with setuptools that still supports use_2to3.
          python -m pip install "setuptools==57.5.0" "wheel==0.45.1"
          python -m pip install --no-build-isolation "https://github.com/danthedeckie/simpleeval/archive/41c99b8e224a7a0ae0ac59c773598fe79a4470db.zip"
          python -m pip install "setuptools==80.9.0"
          if [[ "$(uname -s)" == Linux ]]; then
            python -m pip install --no-binary=hidapi -r requirements-unix.txt
          else
            python -m pip install -r requirements-unix.txt
          fi
          PYTHONPATH=src/main/python python -c 'from hidproxy import hid; assert isinstance(hid.enumerate(), list); print(hid.__file__)'
      - name: Run regression and language tests
        run: python scripts/run_tests.py
      - name: Package native application
        id: pack-native
        if: ${{ !cancelled() && steps.native-hid.outcome == 'success' }}
        run: bash scripts/package_unix.sh
      - name: Test AppImage in all 12 languages
        if: ${{ !cancelled() && runner.os == 'Linux' && steps.pack-native.outcome == 'success' }}
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
          QT_DEBUG_PLUGINS: '1'
        run: |
          shopt -s nullglob
          packages=(dist/*.AppImage)
          test "${#packages[@]}" -eq 1
          xvfb-run --auto-servernum -s '-screen 0 1600x1000x24' \
            python scripts/smoke_unix.py "${packages[0]}"
      - name: Test mounted DMG app in all 12 languages
        if: ${{ !cancelled() && runner.os == 'macOS' && steps.pack-native.outcome == 'success' }}
        run: |
          mount=$(mktemp -d)
          trap 'hdiutil detach "$mount" || true; rmdir "$mount"' EXIT
          hdiutil attach dist/*.dmg -mountpoint "$mount" -nobrowse -readonly
          python scripts/smoke_unix.py "$mount/PandaKB Vial.app/Contents/MacOS/Vial"
      - name: Print package diagnostics
        if: always()
        run: find build/smoke -type f \( -name 'native-crash.log' -o -name 'smoke-*.json' \) -exec cat {} + 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        with:
          name: PandaKB-Vial-${{ matrix.package }}
          path: dist/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-${{ matrix.package }}
          path: |
            build/tests.xml
            build/smoke/
            build/translation-coverage.*
          if-no-files-found: warn
